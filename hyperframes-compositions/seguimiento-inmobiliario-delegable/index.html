<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Seguimiento inmobiliario delegable - Reel 2 (reels-inmobiliarios-serie)</title>
<style>
  :root {
    --bg: #0A0A0A;
    --accent: #FF6B1A;
    --text: #F5F5F5;
    --muted: #9AA0A6;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 1080px; height: 1920px;
    background: var(--bg); overflow: hidden;
    font-family: Inter, system-ui, sans-serif; color: var(--text);
  }
  #stage { position: relative; width: 1080px; height: 1920px; background: var(--bg); }
  .section { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }

  #kicker {
    font-size: 28px; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase;
    opacity: 0; transform: translateY(16px);
    animation: fade-up 0.8s var(--ease) 0.6s forwards;
  }
  .checklist { position: relative; width: 840px; margin-top: 80px; display: flex; flex-direction: column; gap: 96px; }
  .item-row { display: flex; align-items: center; gap: 32px; opacity: 0; transform: translateX(-24px); }
  .item-node { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--muted); flex-shrink: 0; background: transparent; }
  .item-label { font-size: 32px; color: var(--text); font-weight: 700; line-height: 1.26; }

  #item-1 { animation: fade-in-x 0.7s var(--ease) 1.8s forwards; }
  #item-1-node { animation: node-light 0.01s linear 1.8s forwards; }
  #item-2 { animation: fade-in-x 0.7s var(--ease) 5.2s forwards; }
  #item-2-node { animation: node-light 0.01s linear 5.2s forwards; }
  #item-3 { animation: fade-in-x 0.7s var(--ease) 8.6s forwards; }
  #item-3-node { animation: node-light 0.01s linear 8.6s forwards; }
  #item-4 { animation: fade-in-x 0.7s var(--ease) 12.0s forwards; }
  #item-4-node { animation: node-light 0.01s linear 12.0s forwards; }
  #item-5 { animation: fade-in-x 0.7s var(--ease) 15.4s forwards; }
  #item-5-node { animation: node-light 0.01s linear 15.4s forwards; }

  @keyframes fade-up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fade-in-x { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes node-light { from { border-color: var(--muted); background: transparent; } to { border-color: var(--accent); background: var(--accent); } }
</style>
</head>
<body>
  <!--
    Composicion HyperFrames standalone (CLI global `hf`, ver skill
    aetherlogik-hyperframes). Viewport = resolucion de salida exacta
    (1080x1920, igual que el resto de la serie). Duracion total 20.0s
    @24fps = 480 frames, 100% CSS (@keyframes + cubic-bezier(0.16,1,0.3,1),
    el mismo easing del craft de aetherlogik-video) - sin GSAP, por eso el
    elemento raiz lleva data-no-timeline (evita el impuesto de 45s del
    poller documentado en la skill; regla missing_data_no_timeline).

    Contrato COMPLETO del stage aplicado desde el inicio (P-10 de
    Video-problemas.md, serie clinicas/abogados): los 6 atributos
    no-negociables del elemento raiz/#stage (data-composition-id,
    data-start="0", data-duration, data-fps, data-width, data-height) +
    data-no-timeline por ser CSS-puro.

    Los 5 items son sintesis textual EXACTA de las secciones 'Como
    funciona la IA', 'Por que la velocidad de respuesta es critica',
    'Calificacion automatica de prospectos' e 'Integracion con CRM y
    herramientas existentes' del post
    `ia-para-agentes-inmobiliarios-seguimiento-leads.md`, en el mismo
    orden en que aparecen en el post, sin agregar ni quitar ninguno.

    Render (lo ejecuta devops, NO video-producer): pct start 128 ->
    hf lint . && hf render -c index.html -o seguimiento-inmobiliario-delegable.mp4 ->
    pct stop 128.
  -->
  <div
    id="stage"
    data-composition-id="seguimiento-inmobiliario-delegable"
    data-start="0"
    data-duration="20"
    data-fps="24"
    data-width="1080"
    data-height="1920"
    data-no-timeline
  >

    <section id="section-checklist" class="section">
      <div id="kicker">Esto tambien se automatiza</div>
      <div class="checklist">
        <div id="item-1" class="item-row">
          <div id="item-1-node" class="item-node"></div>
          <div class="item-label">Seguimiento las 24 horas, sin importar la hora</div>
        </div>
        <div id="item-2" class="item-row">
          <div id="item-2-node" class="item-node"></div>
          <div class="item-label">Calificacion automatica por comportamiento y urgencia</div>
        </div>
        <div id="item-3" class="item-row">
          <div id="item-3-node" class="item-node"></div>
          <div class="item-label">Mensajes personalizados por propiedad y preferencias</div>
        </div>
        <div id="item-4" class="item-row">
          <div id="item-4-node" class="item-node"></div>
          <div class="item-label">Sincronizacion completa con tu CRM</div>
        </div>
        <div id="item-5" class="item-row">
          <div id="item-5-node" class="item-node"></div>
          <div class="item-label">Programacion de visitas y recordatorios</div>
        </div>
      </div>
    </section>

  </div>
</body>
</html>
